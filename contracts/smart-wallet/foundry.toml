[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
memory_limit = 1073741824
# Raised so the dense adversarial verifier sweep
# (SPHINCsC10AsmAdversarial) — hundreds of full 4008-byte verify runs in
# one test — fits in a single test's gas budget.
gas_limit = "18446744073709551615"
block_gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "test/" }]

[profile.deploy]
optimizer = true
optimizer_runs = 999999
via_ir = true
evm_version = "prague"
solc_version = "0.8.28"

[fmt]
sort_imports = true
wrap_comments = true
