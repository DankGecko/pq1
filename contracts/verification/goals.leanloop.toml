context = """The load-bearing fact for the read_bits_le accumulator invariant
(CWE-347 closure roadmap in ForsExtractWIP.lean). Known-true Nat fact:
disjoint-OR equals ADD. Hand attempts (2026-06-10) found: the disjointness step
