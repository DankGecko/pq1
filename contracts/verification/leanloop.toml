# LeanLoop config for the §33 verification track (github.com/Nicola-Ceornea/LeanLoop).
# Lives HERE (PQSigner side) on purpose: LeanLoop is the public generic tool;
# everything project-specific — config, goal manifests, queue artifacts, run DB —
# stays in this private repo. Run from this directory:
#
#   leanloop doctor
#   leanloop run --manifest goals.leanloop.toml          # queues hard goals
#   leanloop frontier / leanloop submit <goal>           # interactive frontier
#
# (leanloop binary: pip install -e ~/repos/LeanLoop, or use its .venv)

[project]
root = "extracted"           # the Aeneas/hand-written Lean 4 Lake project
lake = "lake"                # needs ~/.elan/bin on PATH (toolchain v4.30.0-rc2 pinned)

[prover]
# generous per-goal budget: candidate verification on this project pays a real
# `lake build` (Aeneas dep); the battery alone is ~10 builds.
goal_timeout_s = 2400

[prover.local]
enabled  = true
backend  = "ollama"
base_url = "http://localhost:11434"   # GPU box later: http://gpu-box:11434 (Tailscale)
model    = "goedel-prover-v2-8b"
samples  = 32
concurrency = 2
self_correct_rounds = 2
health_max_wait_s = 0        # dry-run friendly: skip Tier 1 instantly if prover absent

[prover.frontier]
backend = "queue"            # free: hard goals queue for an interactive Claude Code
                             # session (subscription flat-rate); /leanloop-frontier

[audit]
# The disclosed content axioms of this project (the uninterpreted hash
# boundaries) — refreshed 2026-07-16 (FV review F8): the extracted tree now
# declares THREE, not one, and a whitelist of only `keccak256_pure` would
# FALSE-REJECT any LeanLoop-generated proof over the SlotKdf / slot-entropy goals
# (which legitimately close over `sha256_pure_bytes` / `hmac_sha512_pure_bytes`).
# These are the exact three `^axiom` postulates in extracted/Extracted:
#   keccak256_pure          UserOp/FunsExternal.lean:14   (aa/userop keccak-256)
#   sha256_pure_bytes       SlotKdf/FunsExternal.lean:27  (slot-KDF single-shot SHA-256)
#   hmac_sha512_pure_bytes  SlotKdf/FunsExternal.lean:41  (bip39 seed HMAC-SHA512)
# Everything else must reduce to the three kernel axioms; sorryAx / surprise
# axioms / native_decide are rejected. NB the six SPHINCS+ tweakable-hash names
# (th_pure/th_pair_pure/th_multi_pure/chain_hash_pure/wots_digest_pure/…) are NO
# LONGER axioms — HashPure.lean collapsed them into DEFs over sha256_pure — so do
# NOT re-add them here. See the per-headline manifest at
# extracted/axiom_closure_manifest.txt (the `make verify-extracted` gate).
axiom_whitelist = ["keccak256_pure", "sha256_pure_bytes", "hmac_sha512_pure_bytes"]
