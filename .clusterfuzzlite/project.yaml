# ClusterFuzzLite project config for PQSigner (SOTA 2026-06 §6, Trezor-port).
# Continuous/CI fuzzing of the 12 libFuzzer harnesses in fuzz/fuzz_targets/
# (the pure-logic parsers: UserOp/APDU/HID framing, RLP/EIP-1559, ERC-20,
# MultiSend, and ERC-7730 IR/bundle/display/render). The substrate is the existing
# cargo-fuzz suite (`make fuzz-all`); this adds corpus-persistent CI runs.
language: rust
sanitizers:
  - address
fuzzing_engines:
  - libfuzzer
