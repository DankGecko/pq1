# PQSigner non-negotiable invariants — machine-enforced (Semgrep).
#
# These rules turn the prose invariants in CLAUDE.md ("Non-Negotiable
# Invariants" / "What NOT to do") into a CI gate. Run via `make invariant-gates`
# (which also runs `cargo deny check bans` for the dependency-level invariant #5).
#
# Calibration: rules with ZERO findings on the current tree are ERROR (hard
# gate); rules with pre-existing legitimate-but-discouraged sites are WARNING
# (surface for review, don't break the build). Verified against the tree
# 2026-06-16: the three ERROR rules are clean (0 findings).
#
# Run standalone:  semgrep --config .semgrep/pqsigner-invariants.yml --error
# (`--error` makes a WARNING-only run still exit 0; ERROR findings exit non-zero.)

rules:
  # ── Invariant #5: SPHINCS+C10 is the ONLY signature primitive ──────────────
  - id: no-classical-signer-import
    languages: [generic]
    severity: ERROR
    message: >
      Invariant #5 (non-negotiable): SPHINCS+C10 is the wallet's ONLY signature
      primitive — no classical signer (secp256k1/k256/p256/ecdsa/ed25519/
      schnorrkel) in firmware, FW-update, or the on-chain verifier. Belt-and-
      braces with deny.toml's [bans]. If you truly need this crate, you are
      breaking invariant #5 — stop.
    paths:
      include: ['*.rs']
    patterns:
      - pattern-regex: '(?m)^\s*(use|extern\s+crate)\s+(secp256k1|libsecp256k1|k256|p256|ecdsa|ed25519|ed25519_dalek|ed25519_compact|schnorrkel)\b'

  - id: no-ecrecover-in-wallet-contracts
    languages: [generic]
    severity: ERROR
    message: >
      Invariant #5: the PQ smart wallet has a single c10Verifier and NO classical
      signer. `ecrecover` must not appear in the wallet / factory / verifier
      contracts (a hybrid ECDSA path would re-introduce a classical signer).
    paths:
      include: ['contracts/smart-wallet/src/']
    patterns:
      - pattern-regex: '\becrecover\s*\('

  # ── Invariants #6 / #7: immutable bootstrap keys; monotonic unresettable caps ─
  - id: no-key-rotation-or-cap-reset-in-contracts
    languages: [generic]
    severity: ERROR
    message: >
      Invariants #6/#7 (non-negotiable): bootstrap C10 keys are immutable per
      wallet (CREATE2 salt depends only on them) and per-chain caps are monotonic
      & unresettable. No `rotateMasterKeys`, `reset*`, or `increaseMax*` function
      may exist in the wallet/factory/multiownable contracts.
    paths:
      include: ['contracts/smart-wallet/src/']
    patterns:
      - pattern-regex: '\bfunction\s+(rotateMasterKeys|reset[A-Za-z0-9_]*|increaseMax[A-Za-z0-9_]*)\b'

  # ── Unsafe taxonomy: pure-logic crates are 100% safe Rust ──────────────────
  # Operationalises CLAUDE.md's unsafe taxonomy boundary. The five structurally
  # required `unsafe` categories (CMSE veneers, NS-ptr deref, SHA-256 hooks, FI
  # volatile helpers, static-mut driver state) live in secure/ — with TWO
  # deliberately host-placed exceptions that are `exclude:`d below. These are NOT
  # a regression: they are the SAME structurally-required categories, relocated
  # into a host-runnable crate PRECISELY so they can be formally verified there,
  # and each carries a `// SAFETY:` block (2026-07-14 reconciliation — F13 of the
  # full-project sweep):
  #   * shared/src/ns_ptr_validate.rs — category (2) NS-pointer deref, extracted
  #     verbatim from secure/src/nsc (commit c2cc92c8) so the window check is
  #     Kani-proven (`cargo kani -p sphincs-tz-shared`, the `#[cfg(kani)] mod
  #     verification` block) and the raw `read_volatile`/`write_volatile`/
  #     `from_raw_parts` copy primitives are Miri-tree-borrows-checked
  #     (`cargo +nightly miri test -p sphincs-tz-shared`). Re-exported by
  #     secure/src/nsc/{ns_ptr,ptr_validate}.rs — genuinely shared, not stray.
  #   * pqsigner-erc7730/src/display/render/mod.rs — category (4) FI stack-canary
  #     volatiles (`write_volatile`/`read_volatile` on STACK_CANARY), which rode
  #     into the host crate with the render dispatch (commit 695c1e8b, 2026-07-04)
  #     so it is host-fuzzable / Kani-linkable. They MUST stay volatile — a
  #     `core::hint::black_box` swap gives no stack-materialisation/reload
  #     guarantee, so the overrun check could compile to a no-op (silent FI
  #     weakening), and it contradicts taxonomy category (4) ("must be
  #     read_volatile/write_volatile to defeat compiler folding").
  # The `exclude:` list must stay EXACTLY these two files; `make invariant-gates`
  # asserts that so a future over-broad exclude cannot silently silence a real
  # unsafe. (We deliberately do NOT add a raw-MMIO `*_volatile` rule here: ~50
  # legit sites in secure/ — the documented hw::mmio migration queue + the
  # irreducible fi/nsc/hash categories — would make it pure noise. SAFETY-comment
  # coverage is better enforced by clippy::undocumented_unsafe_blocks than by a
  # generic-mode regex, and "no new flash state" is not expressible soundly.)
  - id: no-unsafe-in-pure-logic-crates
    languages: [generic]
    severity: ERROR
    message: >
      Unsafe taxonomy (CLAUDE.md): the pure-logic workspace crates (proto, bip39,
      tx-core, aa, domain, tx, pqsigner-erc7730, hal, shared) are host-runnable,
      no_std, stack-only, and MUST stay 100% safe Rust — every structurally
      required `unsafe` lives in the secure HAL / NSC veneers / FI helpers, or in
      the two documented host-verified exceptions excluded by this rule
      (shared/src/ns_ptr_validate.rs, pqsigner-erc7730/src/display/render/mod.rs).
      If a parser/derivation seems to need NEW `unsafe`, that is a design smell —
      find the safe formulation.
    paths:
      include:
        - 'proto/src/'
        - 'bip39/src/'
        - 'tx-core/src/'
        - 'aa/src/'
        - 'domain/src/'
        - 'tx/src/'
        - 'pqsigner-erc7730/src/'
        - 'hal/src/'
        - 'shared/src/'
      # Host-relocated structurally-required unsafe — see the header comment
      # above for the Kani/Miri proof pointers. KEEP EXACTLY THESE TWO ENTRIES
      # (asserted by `make invariant-gates`).
      exclude:
        - 'shared/src/ns_ptr_validate.rs'
        - 'pqsigner-erc7730/src/display/render/mod.rs'
    patterns:
      - pattern-regex: '\bunsafe\s*(\{|fn\b|impl\b|trait\b|extern\b)'

  # ── Convention (WARNING): ASCII materialisation via ui::ascii_str ──────────
  - id: from-utf8-unchecked-prefer-ascii-str
    languages: [generic]
    severity: WARNING
    message: >
      Convention (CLAUDE.md unsafe taxonomy): materialise ASCII-by-construction
      buffers via `crate::ui::ascii_str`, not `core::str::from_utf8_unchecked`.
      Review/migrate these call sites. (Known pre-existing: secure/src/main.rs
      boot-fingerprint hex, secure/src/se050_stress.)
    paths:
      include: ['*.rs']
      exclude:
        - '*ascii*.rs'
        - '*/tests/*'
        - '*_under_test/*'
        - '*pure_tests*.rs'
    patterns:
      - pattern-regex: '\bfrom_utf8_unchecked\s*\('
