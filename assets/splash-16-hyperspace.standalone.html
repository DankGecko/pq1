<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PQ1 Splash 16 - Hyperspace</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PQ1Splash = factory();
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var WIDTH = 428, HEIGHT = 142;

  

  // Small, fast, seeded LCG so each animation lays out identically every run.
  function makeRng(seed) {
    var s = seed;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  // 4x4 ordered (Bayer) dither: returns true when value `v` (0..1) should be ON
  // at pixel (x,y). This is what turns smooth fields into 1-bit stipple.
  var BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  function bay(x, y, v) { return v > (BAYER[y & 3][x & 3] + 0.5) / 16; }

  // The official PQ1 wordmark, 41 cells wide, caps 15 rows tall (descender to 18).
  var WORDMARK = [
    '.#############....##############...######',
    '###############..################..######',
    '###############..################..######',
    '####.......####..####........####.....###',
    '###.........###..###..........###.....###',
    '###.........###..###..........###.....###',
    '###.........###..###..........###.....###',
    '###........####..###..........###.....###',
    '###.###########..###..........###.....###',
    '###.###########..###..........###.....###',
    '###.##########...###..........###.....###',
    '###..............####........####.....###',
    '###..............################.....###',
    '###..............################.....###',
    '###...............##############......###',
    '...........................####..........',
    '............................####.........',
    '.............................####........'
  ];

  // Paint a cell grid at (x,y), each cell `s` px square. `test(px,py)` (optional)
  // gates individual device pixels — used for the dither-in logo reveal.
  function glyph(ctx, rows, x, y, s, test) {
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        if (rows[r][c] !== '#') continue;
        for (var dy = 0; dy < s; dy++) {
          for (var dx = 0; dx < s; dx++) {
            var px = x + c * s + dx, py = y + r * s + dy;
            if (!test || test(px, py)) ctx.fillRect(px, py, 1, 1);
          }
        }
      }
    }
  }
  function big(ctx, x, y, s, test) { glyph(ctx, WORDMARK, x, y, s, test); }

  function clear(ctx, fg, bg) {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = fg;
  }

  

  function createHyperspace(opt) {
    var fg = (opt && opt.fg) || '#fff', bg = (opt && opt.bg) || '#000';
    var W = WIDTH, H = HEIGHT, cx = 214, cy = 71;
    var r = makeRng(77), stars = [];
    for (var i = 0; i < 240; i++) stars.push({ x: r() * W, y: r() * H, z: 0.3 + r() * 0.7 });

    return {
      width: W, height: H, fg: fg, bg: bg,
      render: function (ctx, now) {
        var t = now % 7000, s, x, y, q;
        clear(ctx, fg, bg);
        if (t < 1500) {                                    // slow drift
          for (var a = 0; a < stars.length; a++) {
            s = stars[a];
            x = (((s.x - t * 0.012 * s.z) % W) + W) % W;
            if (s.z > 0.6 || bay(x | 0, s.y | 0, 0.4)) ctx.fillRect(x | 0, s.y | 0, 1, 1);
          }
        } else if (t < 2700) {                             // warp: radial streaks
          var k = (t - 1500) / 1200, kk = k * k;
          for (var b = 0; b < stars.length; b++) {
            s = stars[b];
            var dx = s.x - cx, dy = s.y - cy, d = Math.hypot(dx, dy) || 1;
            var ux = dx / d, uy = dy / d, L = kk * (16 + 120 * s.z);
            for (q = 0; q < L; q++) {
              x = Math.round(s.x + ux * q); y = Math.round(s.y + uy * q * 0.6);
              if (x < 0 || x >= W || y < 0 || y >= H) break;
              ctx.fillRect(x, y, 1, 1);
            }
          }
        } else {                                           // materialize + hold
          var p = Math.min(1, (t - 2700) / 800);
          if (p < 1) {
            var fade = 1 - p;
            for (var c2 = 0; c2 < stars.length; c2++) {
              s = stars[c2]; if (s.z < 0.5) continue;
              var dx2 = s.x - cx, dy2 = s.y - cy, d2 = Math.hypot(dx2, dy2) || 1;
              var L2 = fade * (16 + 120 * s.z);
              for (q = 0; q < L2; q++) {
                x = Math.round(s.x + (dx2 / d2) * (q + (1 - fade) * 80));
                y = Math.round(s.y + (dy2 / d2) * q * 0.6);
                if (x < 0 || x >= W || y < 0 || y >= H) break;
                if (bay(x, y, fade)) ctx.fillRect(x, y, 1, 1);
              }
            }
          } else {                                         // settled, twinkling
            for (var e = 0; e < stars.length; e++) {
              s = stars[e];
              var tw = Math.sin(now * 0.002 + s.x * 13.7 + s.y * 7.1);
              if (s.x > 116 && s.x < 312 && s.y > 24 && s.y < 116) continue;
              if (s.z > 0.55 && tw > -0.7) ctx.fillRect(s.x | 0, s.y | 0, 1, 1);
              else if (tw > 0.5 && bay(s.x | 0, s.y | 0, 0.4)) ctx.fillRect(s.x | 0, s.y | 0, 1, 1);
            }
          }
          big(ctx, 132, 34, 4, p >= 1 ? null : function (px, py) { return bay(px, py, p); });
        }
      }
    };
  }

  

  function createHorizon(opt) {
    var fg = (opt && opt.fg) || '#fff', bg = (opt && opt.bg) || '#000';
    var W = WIDTH, H = HEIGHT, R = 731, pcx = 214;
    function limbY(x) { return 104 + R - Math.sqrt(R * R - (x - pcx) * (x - pcx)); }
    var r0 = makeRng(55), stars = [];
    for (var i = 0; i < 150; i++) {
      var x = (r0() * W) | 0, y = (r0() * H) | 0, k = r0(), born = r0() * 1400;
      if (y > limbY(x) - 4) continue;
      if (x > 116 && x < 312 && y > 0 && y < 100) continue;
      stars.push({ x: x, y: y, k: k, born: born });
    }
    function ease(u) { return 1 - Math.pow(1 - u, 3); }

    return {
      width: W, height: H, fg: fg, bg: bg,
      render: function (ctx, now) {
        var t = now, s, x, y, ly, depth, v;
        clear(ctx, fg, bg);
        for (var a = 0; a < stars.length; a++) {
          s = stars[a]; if (t < s.born) continue;
          var tw = Math.sin(now * 0.0015 + s.x * 13.7 + s.y * 7.1);
          if (s.k > 0.45) { if (tw > -0.85) ctx.fillRect(s.x, s.y, 1, 1); }
          else if (tw > -0.2 && bay(s.x, s.y, 0.3)) ctx.fillRect(s.x, s.y, 1, 1);
        }
        var rise = (1 - ease(Math.min(1, Math.max(0, (t - 700) / 1900)))) * 52;
        for (x = 0; x < W; x++) {
          ly = limbY(x) + rise;
          for (y = Math.ceil(ly); y < H; y++) {
            depth = y - ly;
            if (depth < 2.5) { ctx.fillRect(x, y, 1, 1); continue; }
            v = Math.max(0.03, 0.5 - depth * 0.0225);
            if (bay(x, y, v)) ctx.fillRect(x, y, 1, 1);
          }
        }
        if (t > 2600) {
          var op = Math.min(1, (t - 2600) / 700);
          for (var i = 0; i < 720; i++) {
            var ang = (i / 720) * Math.PI * 2;
            x = Math.round(214 + Math.cos(ang) * 260); y = Math.round(112 + Math.sin(ang) * 52);
            if (x < 0 || x >= W || y < 0 || y >= H) continue;
            if (y > limbY(x) + 1 && Math.sin(ang) > 0) continue;
            if (i % 8 < 4 && bay(x, y, op)) ctx.fillRect(x, y, 1, 1);
          }
          var ma = Math.PI + (t - 2600) * 0.00042;
          var mx = Math.round(214 + Math.cos(ma) * 260), my = Math.round(112 + Math.sin(ma) * 52);
          if (!(my > limbY(mx) + 1 && Math.sin(ma) > 0) && mx > 1 && mx < W - 3 && my > 1 && my < H - 3) {
            ctx.fillRect(mx - 1, my - 1, 3, 3);
          }
        }
        var p = Math.min(1, Math.max(0, (t - 1900) / 900));
        if (p > 0) big(ctx, 132, 12, 4, p >= 1 ? null : function (px, py) { return bay(px, py, p); });
      }
    };
  }

  

  function createNebula(opt) {
    var fg = (opt && opt.fg) || '#fff', bg = (opt && opt.bg) || '#000';
    var W = WIDTH, H = HEIGHT;
    var r0 = makeRng(21), stars = [];
    for (var i = 0; i < 60; i++) {
      var x = (r0() * W) | 0, y = (r0() * H) | 0, k = r0();
      if (x > 116 && x < 312 && y > 24 && y < 116) continue;
      stars.push({ x: x, y: y, k: k });
    }
    function noise(x, y, t) {
      var v = 0, a = 0.55, f = 0.0375;
      for (var o = 0; o < 3; o++) {
        v += a * (Math.sin(x * f + Math.sin(y * f * 1.31 + o * 2.1 + t * 0.18) * 2.3 + o * 4.7) +
                  Math.cos(y * f * 0.83 + Math.sin(x * f * 1.17 + o * 1.3 - t * 0.11) * 1.9)) / 2;
        a *= 0.5; f *= 2.15;
      }
      return v * 0.5 + 0.5;
    }
    // coarse field + bilinear interpolation keeps the fine grid cheap
    var step = 4, gw = (W / step) + 1 | 0, gh = (H / step) + 1 | 0;
    var field = new Float32Array(gw * gh);

    return {
      width: W, height: H, fg: fg, bg: bg,
      render: function (ctx, now) {
        var t = now / 1000, drift = t * 6.4, gx, gy, fx, fy, x, y, s;
        for (gy = 0; gy < gh; gy++)
          for (gx = 0; gx < gw; gx++)
            field[gy * gw + gx] = noise(gx * step + drift, gy * step, t);
        clear(ctx, fg, bg);
        for (y = 0; y < H; y++) {
          gy = (y / step) | 0; fy = y / step - gy;
          for (x = 0; x < W; x++) {
            var d = Math.hypot(x - 214, (y - 70) * 1.9);
            var carve = Math.min(1, Math.max(0, (d - 104) / 68));
            if (carve <= 0) continue;
            gx = (x / step) | 0; fx = x / step - gx;
            var idx = gy * gw + gx;
            var n = field[idx] * (1 - fx) * (1 - fy) + field[idx + 1] * fx * (1 - fy) +
                    field[idx + gw] * (1 - fx) * fy + field[idx + gw + 1] * fx * fy;
            var v = Math.pow(n, 2.2) * 0.7 * carve;
            if (v > 0.02 && bay(x, y, v)) ctx.fillRect(x, y, 1, 1);
          }
        }
        for (var a = 0; a < stars.length; a++) {
          s = stars[a];
          var tw = Math.sin(now * 0.0017 + s.x * 9.3 + s.y * 5.7);
          if (s.k > 0.5) { if (tw > -0.8) ctx.fillRect(s.x, s.y, 1, 1); }
          else if (tw > 0.3) ctx.fillRect(s.x, s.y, 1, 1);
        }
        var p = Math.min(1, now / 900);
        big(ctx, 132, 34, 4, p >= 1 ? null : function (px, py) { return bay(px, py, p); });
      }
    };
  }

  

  var REGISTRY = {
    hyperspace: createHyperspace,   // 16
    horizon: createHorizon,         // 17
    nebula: createNebula            // 18
  };

  // Build an animation renderer you drive yourself. opt: { fg, bg }
  function create(name, opt) {
    var f = REGISTRY[name];
    if (!f) throw new Error('PQ1Splash: unknown animation "' + name + '". Use hyperspace | horizon | nebula.');
    return f(opt || {});
  }

  // Size the canvas to native res, run the rAF loop, return a controller.
  // opt: { fg, bg, autoStart (default true) }
  function mount(canvas, name, opt) {
    opt = opt || {};
    var anim = create(name, opt);
    var ctx = canvas.getContext('2d');
    canvas.width = anim.width;
    canvas.height = anim.height;
    ctx.imageSmoothingEnabled = false;
    canvas.style.imageRendering = 'pixelated';

    var raf = 0, t0 = 0, paused = 0, pausedAt = 0;
    function frame(nowAbs) {
      anim.render(ctx, nowAbs - t0 - paused);
      raf = requestAnimationFrame(frame);
    }
    var ctrl = {
      canvas: canvas, anim: anim,
      start: function () {
        if (raf) return ctrl;
        if (!t0) t0 = performance.now();
        if (pausedAt) { paused += performance.now() - pausedAt; pausedAt = 0; }
        raf = requestAnimationFrame(frame);
        return ctrl;
      },
      stop: function () { if (raf) { cancelAnimationFrame(raf); raf = 0; pausedAt = performance.now(); } return ctrl; },
      restart: function () { t0 = performance.now(); paused = 0; pausedAt = 0; return ctrl; }
    };
    if (opt.autoStart !== false) ctrl.start();
    return ctrl;
  }

  return {
    create: create,
    mount: mount,
    list: function () { return Object.keys(REGISTRY); },
    WIDTH: WIDTH, HEIGHT: HEIGHT
  };
}));
</script>
<script>
  var ctrl = PQ1Splash.mount(document.getElementById('screen'), 'hyperspace');
  function fit() {
    var c = ctrl.canvas;
    var s = Math.max(1, Math.floor(Math.min(
      window.innerWidth / PQ1Splash.WIDTH, window.innerHeight / PQ1Splash.HEIGHT)));
    c.style.width  = (PQ1Splash.WIDTH  * s) + 'px';
    c.style.height = (PQ1Splash.HEIGHT * s) + 'px';
  }
  fit(); window.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', function () {
    document.hidden ? ctrl.stop() : ctrl.start();
  });
</script>
</body>
</html>
