[package]
name = "sphincs-tz-bip39"
version = "0.1.0"
edition.workspace = true

# A small no_std BIP-39 implementation. Hosted in its own workspace crate so
# that it can be unit-tested on the host (`cargo test -p sphincs-tz-bip39`)
# while still being usable from the no_std secure-world firmware.

[dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
hex = "0.4"
