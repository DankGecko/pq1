name: ClusterFuzzLite (PR)

# Time-boxed fuzzing of code changed in a PR (SOTA 2026-06 §6, Trezor-port).
# `code-change` mode fuzzes only what the diff touches, so it's fast enough
# for per-PR. A regression (new crash) fails the check + uploads a SARIF.
# The deeper continuous sweep is cflite-batch.yml (scheduled).

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.lean'

permissions:
  contents: read
  security-events: write

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    # NON-BLOCKING until the OSS-Fuzz Docker build (.clusterfuzzlite/build.sh,
    # cargo-fuzz from the excluded fuzz/ workspace inside base-builder-rust) is
    # proven green by a real run — it can't be validated off-CI. A build hiccup
    # then reports but does NOT redden every PR. Remove `continue-on-error`
    # once a first run is green to promote it to a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: address
          output-sarif: true
