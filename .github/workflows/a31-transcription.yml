name: A3.1 transcription lint

# Dedicated gate for the A3.1 hand-transcription residual: the deployed verifier
# SOURCE (SPHINCsC10Asm.sol) and its Lean transcription (c10Program) must not drift.
# This MUST run whenever EITHER side changes. The main `ci.yml` workflow `paths-ignore`s
# `**/*.lean` and `contracts/verification/**`, so a PR that edits ONLY C10Program.lean
# (the transcription side — the likelier drift) would skip ci.yml entirely. This
# workflow uses a POSITIVE `paths:` filter so the lint fires exactly when transcription
# drift is possible. The checks are pure Python, but the authoritative
# verification Makefile deliberately requires the pinned elan `lake` shim as
# part of its shared fail-closed trust root. See
# contracts/verification/docs/findings/A3_1_ADVERSARIAL_REVIEW_2026-06-18.md.
#
# `verify-transcription` runs THREE pure-Python checks: (1) the POSITIONAL statistical
# lint (constant-sets / kind-histogram / gate-vars); (2) the STRUCTURAL AST check
# (check_c10_transcription_ast.py) — parses both the .sol Yul and the c10Program literal
# into the Interpreter.Yul AST and asserts TREE EQUALITY, closing the statistical lint's
# intra-fragment hole (reorder / var-swap / operand-swap); (3) the NEGATIVE-CONTROL harness
# proving those mutants are invisible to (1) yet caught by (2).
#
# Scope reminder: these are REGRESSION GATES + a structural cross-check, not a proof. They
# are the ONLY CI-enforced piece of the A3.1 Lean track (this job installs the
# elan shim for the common Makefile preflight but does not run the Lean build
# suite). The structural check now covers intra-fragment
# source<->AST fidelity in CI (previously local-only); the source->deployed-bytecode leg
# (R1) and the both-N-masked functional behaviour stay covered by the local `verify-interp`
# 396-vector corpus + the kernel `execC10Asm_eq`.

on:
  push:
    branches: [master]
    paths:
      - 'contracts/smart-wallet/src/verifiers/SPHINCsC10Asm.sol'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Program.lean'
      - 'contracts/verification/scripts/check_c10_transcription.py'
      - 'contracts/verification/scripts/check_c10_transcription_ast.py'
      - 'contracts/verification/scripts/test_c10_transcription_ast_negative.py'
      - 'contracts/verification/scripts/check_c10_source_pin.py'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Source.lean'
      - 'contracts/verification/Makefile'
      - '.github/workflows/a31-transcription.yml'
  pull_request:
    paths:
      - 'contracts/smart-wallet/src/verifiers/SPHINCsC10Asm.sol'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Program.lean'
      - 'contracts/verification/scripts/check_c10_transcription.py'
      - 'contracts/verification/scripts/check_c10_transcription_ast.py'
      - 'contracts/verification/scripts/test_c10_transcription_ast_negative.py'
      - 'contracts/verification/scripts/check_c10_source_pin.py'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Source.lean'
      - 'contracts/verification/Makefile'
      - '.github/workflows/a31-transcription.yml'

permissions:
  contents: read

jobs:
  transcription-lint:
    name: c10Program <-> SPHINCsC10Asm.sol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install elan shim (verification Makefile trust root)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: transcription-fidelity checks (positional lint + structural AST + negative controls)
        run: make -C contracts/verification verify-transcription
