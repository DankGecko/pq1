name: A3.1 transcription lint

# Dedicated gate for the A3.1 hand-transcription residual: the deployed verifier
# SOURCE (SPHINCsC10Asm.sol) and its Lean transcription (c10Program) must not drift.
# This MUST run whenever EITHER side changes. The main `ci.yml` workflow is
# unfiltered today; this dedicated workflow keeps a POSITIVE `paths:` filter so
# the lint continues to fire exactly when transcription drift is possible even
# if the broad workflow later gains path exclusions. The checks are pure Python,
# but the authoritative
# verification Makefile deliberately requires the pinned elan `lake` shim as
# part of its shared fail-closed trust root. See
# contracts/verification/docs/findings/A3_1_ADVERSARIAL_REVIEW_2026-06-18.md.
#
# `verify-transcription` runs five pure-Python checks: the positional statistical
# lint, structural AST equality, the structural negative-control harness, the
# source byte-pin, and the Rust/Solidity/Lean signed-digest field-order pin.
#
# Scope reminder: these are regression gates and a structural cross-check, not a
# proof. This workflow is the dedicated CI enforcement for the
# source<->transcription leg; `lean-fv.yml` separately enforces the Lean proof
# and axiom-closure legs. This job installs the elan shim for the common
# Makefile preflight but does not run the Lean build suite. The structural check
# covers intra-fragment source<->AST fidelity; the source->deployed-bytecode leg
# (R1) and both-N-masked functional behaviour stay covered by the local
# `verify-interp` corpus plus the kernel `execC10Asm_eq`.

on:
  push:
    branches: [master]
    paths:
      - 'contracts/smart-wallet/src/verifiers/SPHINCsC10Asm.sol'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Program.lean'
      - 'contracts/verification/scripts/check_c10_transcription.py'
      - 'contracts/verification/scripts/check_c10_transcription_ast.py'
      - 'contracts/verification/scripts/test_c10_transcription_ast_negative.py'
      - 'contracts/verification/scripts/check_c10_source_pin.py'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Source.lean'
      - 'contracts/verification/scripts/check_sphincs_digest_field_order.py'
      - 'aa/src/userop.rs'
      - 'contracts/smart-wallet/src/PQSmartWallet.sol'
      - 'contracts/verification/lean/SphincsCVerify/Wallet/ValidateUserOp.lean'
      - 'contracts/verification/Makefile'
      - '.github/workflows/a31-transcription.yml'
  pull_request:
    paths:
      - 'contracts/smart-wallet/src/verifiers/SPHINCsC10Asm.sol'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Program.lean'
      - 'contracts/verification/scripts/check_c10_transcription.py'
      - 'contracts/verification/scripts/check_c10_transcription_ast.py'
      - 'contracts/verification/scripts/test_c10_transcription_ast_negative.py'
      - 'contracts/verification/scripts/check_c10_source_pin.py'
      - 'contracts/verification/lean/SphincsCVerify/Interpreter/C10Source.lean'
      - 'contracts/verification/scripts/check_sphincs_digest_field_order.py'
      - 'aa/src/userop.rs'
      - 'contracts/smart-wallet/src/PQSmartWallet.sol'
      - 'contracts/verification/lean/SphincsCVerify/Wallet/ValidateUserOp.lean'
      - 'contracts/verification/Makefile'
      - '.github/workflows/a31-transcription.yml'

permissions:
  contents: read

jobs:
  transcription-lint:
    name: c10Program <-> SPHINCsC10Asm.sol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: install elan shim (verification Makefile trust root)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: transcription-fidelity checks (positional lint + structural AST + negative controls)
        run: make -C contracts/verification verify-transcription
