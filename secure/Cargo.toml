[package]
name = "sphincs-tz-secure"
version = "0.1.0"
edition.workspace = true

[dependencies]
sphincs-tz-shared = { path = "../shared" }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

# Crypto (all no_std, no alloc)
slh-dsa = { version = "0.2.0-rc.4", default-features = false }
signature = { version = "3.0.0-rc.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
zerocopy = { version = "0.8", default-features = false }

[features]
default = ["mock-se"]
mock-se = []

