  "_origin": "Generated by upstream ZKNoxHQ/ZKlarity (commit 5e8b3f9) via `snarkjs powersoftau new bls12-381 14 ...` followed by a single random-entropy `powersoftau contribute` and `powersoftau prepare phase2`. NOT a globally well-known PTAU file. Anyone wishing to regenerate this exact byte sequence cannot do so deterministically; instead, treat the SHA-256 above as the canonical reference and either copy the existing file or re-run upstream's pipeline and accept that any new VK will differ from the committed one.",
  "_security_note": "SECURITY — ceremony integrity IS load-bearing; this is NOT 'just reproducibility'. Signing the VK with the firmware-signing key proves the VK is AUTHENTIC (the one PQ1 intended); it does NOT make proofs for that VK SOUND. Authenticity != soundness: anyone holding the trusted-setup toxic waste (phase-2 delta, or phase-1 tau/alpha/beta) can forge a clear-sign proof for ANY order that still verifies against the honest, signed VK (verified empirically — a forged proof verifies against its own legitimately-exported VK). The toxic waste MUST be destroyed. Today the untrusted companion/host — the adversary clear-signing exists to defend against — cannot forge ONLY because snarkjs 0.7.4 `zkey contribute` mixes fresh OS entropy (getRandomRng, build/cli.cjs:311) that is then discarded, so delta is not recoverable from the committed contribution.seed nor from the published VK. That safety is ACCIDENTAL, not designed. Do NOT make the phase-2 contribution recoverable: no deterministic RNG, no `zkey beacon`, no committed full-entropy value, and never skip `zkey contribute` (the initial `groth16 setup` delta is a known constant) — each of those makes delta public and silently breaks clear-signing while the signed VK keeps verifying green. Note there is NO multi-party ceremony here (locally-generated pot + a single contribution), so soundness-against-PQ1 is NOT achieved cryptographically; it rests on PQ1 having discarded the build entropy. For a hardware wallet that residual maker-trust is acceptable (the firmware is already trusted), but it is a real trust assumption — not 'irrelevant'.",
