[package]
name = "driver"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
rand_core = "0.6.4"
# checkct_macros ships with the cargo-checkct tool. This relative path assumes
# the tool is cloned as a sibling of this repo (i.e. ~/repos/cargo-checkct);
# adjust if you cloned it elsewhere. See ../DONJON-RUST-TOOLING.md for setup.
checkct_macros = { path = "../../../../../cargo-checkct/checkct_macros" }
# The crate under test — repo-relative so the workspace is portable.
sphincs-c10 = { path = "../../../../sphincs-c10" }
