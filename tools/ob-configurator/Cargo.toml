[package]
name = "ob-configurator"
version = "0.1.0"
edition = "2021"

# Standalone crate, intentionally outside the root workspace (needs its
# own RUSTFLAGS / linker config — see root Cargo.toml "Intentionally NOT
# in the workspace"). The empty table keeps cargo from resolving the
# parent workspace so `cargo check` works from this directory.
[workspace]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
